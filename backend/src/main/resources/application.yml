spring:
  application:
    name: stockcare-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockcare}
    username: ${SPRING_DATASOURCE_USERNAME:stockcare}
    password: ${SPRING_DATASOURCE_PASSWORD:stockcare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

stockcare:
  jwt:
    secret: ${STOCKCARE_JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-32b+}
    expiration-minutes: ${STOCKCARE_JWT_EXPIRATION_MINUTES:120}
    issuer: stockcare
  cors:
    allowed-origins: ${STOCKCARE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${STOCKCARE_SEED_ENABLED:true}
  tracking:
    # Simulator cadence in milliseconds for live delivery tracking.
    tick-ms: ${STOCKCARE_TRACKING_TICK_MS:2000}
  workflow:
    # Automated workflow behaviour. On predicted shortage: "draft" | "alert" | "off".
    shortage-action: ${STOCKCARE_WORKFLOW_SHORTAGE_ACTION:draft}
    # Auto-submit auto-created drafts (pharmacy review is skipped when true).
    auto-submit: ${STOCKCARE_WORKFLOW_AUTO_SUBMIT:false}
    # Calculate priority automatically through the request lifecycle.
    auto-priority: ${STOCKCARE_WORKFLOW_AUTO_PRIORITY:true}
    # Approving requests for planning triggers a fleet-wide MILP solve automatically.
    # Default true: real-time solving is the product behaviour, not a Compose-only extra.
    auto-route: ${STOCKCARE_WORKFLOW_AUTO_ROUTE:true}
    # Minimum approved, unplanned requests before automatic planning fires.
    auto-route-min-requests: ${STOCKCARE_WORKFLOW_AUTO_ROUTE_MIN_REQUESTS:1}
    # When a new approval arrives while route proposals are still awaiting the depot's
    # decision, cancel those proposals and re-solve the whole backlog in one MILP run,
    # so the proposed routes always reflect the complete current demand.
    auto-route-replan: ${STOCKCARE_WORKFLOW_AUTO_ROUTE_REPLAN:true}
  # Model wiring. Defaults are the REAL external services (same URLs as docker-compose,
  # mapped to localhost for IDE/mvn runs). Set mode=mock explicitly to develop without
  # the Python services; routing then falls back to a clearly-labelled greedy heuristic.
  models:
    prediction:
      mode: ${STOCKCARE_MODEL_PREDICTION_MODE:external}
      url: ${STOCKCARE_PREDICTION_URL:http://localhost:8000}
      timeout-ms: ${STOCKCARE_PREDICTION_TIMEOUT_MS:8000}
      horizon-days: 14
      version: ${STOCKCARE_MODEL_PREDICTION_VERSION:lightgbm-v1}
    priority:
      mode: ${STOCKCARE_MODEL_PRIORITY_MODE:mock}
      version: mock-priority-v1
    route-optimization:
      mode: ${STOCKCARE_MODEL_ROUTE_MODE:external}
      url: ${STOCKCARE_ROUTING_URL:http://localhost:8002}
      timeout-ms: ${STOCKCARE_ROUTING_TIMEOUT_MS:90000}
      version: ${STOCKCARE_MODEL_ROUTE_VERSION:milp-care-v1}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
