spring:
  application:
    name: stockcare-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockcare}
    username: ${SPRING_DATASOURCE_USERNAME:stockcare}
    password: ${SPRING_DATASOURCE_PASSWORD:stockcare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

stockcare:
  jwt:
    secret: ${STOCKCARE_JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-32b+}
    expiration-minutes: ${STOCKCARE_JWT_EXPIRATION_MINUTES:120}
    issuer: stockcare
  cors:
    allowed-origins: ${STOCKCARE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${STOCKCARE_SEED_ENABLED:true}
  tracking:
    # Simulator cadence in milliseconds for live delivery tracking.
    tick-ms: ${STOCKCARE_TRACKING_TICK_MS:2000}
  workflow:
    # Automated workflow behaviour. On predicted shortage: "draft" | "alert" | "off".
    shortage-action: ${STOCKCARE_WORKFLOW_SHORTAGE_ACTION:draft}
    # Auto-submit auto-created drafts (pharmacy review is skipped when true).
    auto-submit: ${STOCKCARE_WORKFLOW_AUTO_SUBMIT:false}
    # Calculate priority automatically through the request lifecycle.
    auto-priority: ${STOCKCARE_WORKFLOW_AUTO_PRIORITY:true}
    # Readiness flag for automatic route planning (kept manual/approved in the MVP).
    auto-route: ${STOCKCARE_WORKFLOW_AUTO_ROUTE:false}
  # Mock vs external model wiring. Only "mock" is implemented in the MVP;
  # "external" hooks are prepared behind the same interfaces.
  models:
    prediction:
      mode: ${STOCKCARE_MODEL_PREDICTION_MODE:mock}
      url: ${STOCKCARE_PREDICTION_URL:}
      timeout-ms: ${STOCKCARE_PREDICTION_TIMEOUT_MS:8000}
      horizon-days: 14
      version: mock-prediction-v1
    priority:
      mode: ${STOCKCARE_MODEL_PRIORITY_MODE:mock}
      version: mock-priority-v1
    route-optimization:
      mode: ${STOCKCARE_MODEL_ROUTE_MODE:mock}
      version: mock-route-v1

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
