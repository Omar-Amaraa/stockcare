# Profile for future @SpringBootTest integration tests (H2, schema from entities, no Flyway).
spring:
  datasource:
    url: jdbc:h2:mem:stockcare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
stockcare:
  seed:
    enabled: false
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long-000
